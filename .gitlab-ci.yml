stages:
  - verify

verify:
  stage: verify
  image: golang:1.23-bookworm
  services:
    - name: postgres:17-bookworm
  variables:
    POSTGRES_DB: starter_ci
    POSTGRES_USER: starter_ci
    POSTGRES_HOST_AUTH_METHOD: trust
    TEST_DATABASE_URL: postgres://starter_ci@postgres:5432/starter_ci?sslmode=disable
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl unzip postgresql-client ca-certificates
    - rm -rf /var/lib/apt/lists/*
    - export BUN_INSTALL=/usr/local/bun
    - curl -fsSL https://bun.com/install | bash -s "bun-v1.3.14"
    - export PATH="$BUN_INSTALL/bin:$PATH"
    - test "$(bun --version)" = "1.3.14"
    - until pg_isready -h postgres -U starter_ci -d starter_ci; do sleep 1; done
  script:
    - ./scripts/setup.sh
    - ./scripts/verify.sh
